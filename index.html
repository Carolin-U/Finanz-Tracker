<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinky – Finanz-Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff0f5;--card:#ffffff;--ink:#3d1230;--mute:#9a6b86;--pink:#ff5c9a;--pink2:#ffd1e3;--deep:#c2185b;--line:#f7c9dc;--good:#1f9d6b;--bad:#c2185b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f22;--card:#3b1630;--ink:#ffe7f1;--mute:#d49ab9;--pink:#ff6fa8;--pink2:#5a2147;--deep:#ff8fbd;--line:#5a2147;--good:#52d6a0;--bad:#ff8fbd}}
:root[data-theme="dark"]{--bg:#2a0f22;--card:#3b1630;--ink:#ffe7f1;--mute:#d49ab9;--pink:#ff6fa8;--pink2:#5a2147;--deep:#ff8fbd;--line:#5a2147;--good:#52d6a0;--bad:#ff8fbd}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.hero{background:var(--pink);color:#fff;border-radius:28px;padding:26px 22px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero small{opacity:.9;font-weight:500}
.big{font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0 14px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500}
.link{background:none;color:#fff;text-decoration:underline;font-size:14px;padding:6px 0;margin-top:10px;display:block}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
h2{font-size:20px;font-weight:700;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:var(--pink2);padding:5px;border-radius:99px;margin-top:20px}
.tabs button{flex:1;background:none;padding:10px;border-radius:99px;font-weight:700;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--deep)}
.add{width:100%;margin-top:16px;background:var(--ink);color:var(--bg);padding:15px;border-radius:18px;font-weight:700;font-size:17px}
label{display:block;font-weight:500;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.auto{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--pink2);font-weight:500}
.auto input{width:20px;height:20px;accent-color:var(--pink)}
.primary{width:100%;margin-top:16px;background:var(--pink);color:#fff;padding:14px;border-radius:16px;font-weight:700;font-size:16px}
.ghost{background:var(--pink2);color:var(--deep);padding:10px 14px;border-radius:12px;font-weight:700}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:42px;height:42px;border-radius:14px;background:var(--pink2);display:grid;place-items:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:13px;color:var(--mute)}
.amt{font-weight:700;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--good)}
.x{background:none;color:var(--mute);font-size:20px;padding:6px 8px}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--pink2);margin:6px 0 12px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--pink)}
.sw input:checked+span:after{left:23px}
.sw input:focus-visible+span{outline:3px solid var(--deep);outline-offset:2px}
.tabs button{font-size:14px;padding:10px 4px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh h2{margin:0;text-transform:capitalize}
.nav{background:var(--pink2);color:var(--deep);width:40px;height:40px;border-radius:12px;font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.1;border-radius:12px;background:var(--bg);border:1.5px solid transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink)}
.day.fut{background:var(--pink2)}
.day.today{border-color:var(--pink)}
.day.sel{background:var(--pink);color:#fff}
.dots{display:flex;gap:2px;height:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--deep)}
.dots i.in{background:var(--good)}
.day.sel .dots i{background:#fff}
.day small{font-size:10px;line-height:1;color:var(--mute);height:10px}
.day.sel small{color:#fff}
.fc{display:flex;justify-content:space-between;gap:10px;background:var(--pink2);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:500}
.dh{margin:18px 0 4px;font-weight:700}
.setup{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.setup h1{font-size:40px;font-weight:800;line-height:1.05;margin-bottom:10px}
.setup p{color:var(--mute);margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:500;max-width:90%;z-index:9}
.hide{display:none!important}
.foot{margin-top:24px;text-align:center}
.foot button{background:none;color:var(--mute);font-size:14px;text-decoration:underline;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const CATS={Essen:['🍜','#ff5c9a'],Shopping:['🛍️','#c2185b'],Wohnen:['🏠','#ff9bc2'],Abos:['📺','#9c4dcc'],Mobilität:['🚌','#ff7a59'],Freizeit:['🎀','#f06ab8'],Sonstiges:['✨','#b88aa6'],Einkommen:['💸','#1f9d6b']};
const EUR=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fdate=s=>parse(s).toLocaleDateString('de-DE',{day:'2-digit',month:'short'});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='pinky-v1';
let S={start:null,tx:[],rules:[]};
let ui={tab:'cal',form:false,type:'out',editBal:false,confirm:false,toast:''};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const bal=()=>S.start+S.tx.filter(t=>t.date<=today()).reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0);
function evs(to){const t=today(),L=[];
 S.tx.forEach(x=>{if(x.date<=to)L.push({...x,k:x.date<=t?'done':'plan'})});
 S.rules.forEach(r=>{if(!r.active)return;const c={...r};let g=0;while(c.next<=to&&g++<400){if(c.next>t)L.push({type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:c.next,k:'auto'});advance(c)}});
 return L}
const sgn=e=>e.type==='in'?e.amt:-e.amt;

function addMonth(d,day){const n=new Date(d.getFullYear(),d.getMonth()+1,1);const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();n.setDate(Math.min(day,last));return n}
function advance(r){const d=parse(r.next);r.next=iso(r.freq==='weekly'?new Date(d.getFullYear(),d.getMonth(),d.getDate()+7):addMonth(d,r.day))}
function runRules(){let n=0;const t=today();
 for(const r of S.rules){if(!r.active)continue;let g=0;
  while(r.next<=t&&g++<120){S.tx.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:r.next,auto:true});advance(r);n++}}
 if(n){save();ui.toast=n+(n===1?' automatische Buchung ausgeführt':' automatische Buchungen ausgeführt')}}

function toast(m){ui.toast=m;render();setTimeout(()=>{ui.toast='';render()},2600)}
function render(){
 const el=document.getElementById('app');
 if(S.start===null){el.innerHTML=`<div class="setup"><h1>Hi 💗<br>Wie viel ist gerade auf deinem Konto?</h1><p>Das ist dein Startwert. Danach trackst du alles Weitere hier.</p>
 <label for="b0">Kontostand in Euro</label><input id="b0" inputmode="decimal" placeholder="z. B. 842,50" autocomplete="off">
 <button class="primary" id="go">Los geht's</button></div>`;
  const go=()=>{const v=num(document.getElementById('b0').value);if(isNaN(v)){toast('Bitte gib eine Zahl ein, z. B. 842,50');return}S.start=v;save();render()};
  document.getElementById('go').onclick=go;document.getElementById('b0').onkeydown=e=>{if(e.key==='Enter')go()};return}
 ui.calM=ui.calM||today().slice(0,7);ui.sel=ui.sel||today();
 const now=new Date(),ym=iso(now).slice(0,7);
 const mt=S.tx.filter(t=>t.date.slice(0,7)===ym&&t.date<=today());
 const inc=mt.filter(t=>t.type==='in').reduce((a,t)=>a+t.amt,0),out=mt.filter(t=>t.type==='out').reduce((a,t)=>a+t.amt,0);
 const b=bal();
 const byCat={};mt.filter(t=>t.type==='out').forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);
 const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
 let h=`<section class="hero"><small>Dein Kontostand</small><div class="big">${EUR(b)}</div>
 <div class="row"><span class="chip">＋ ${EUR(inc)} diesen Monat</span><span class="chip">− ${EUR(out)} diesen Monat</span></div>
 <button class="link" id="eb">Kontostand anpassen</button></section>`;
 if(ui.editBal)h+=`<div class="card"><label for="nb" style="margin-top:0">Neuer Kontostand</label><input id="nb" inputmode="decimal" value="${String(b.toFixed(2)).replace('.',',')}"><button class="primary" id="sb">Kontostand speichern</button></div>`;
 if(cats.length)h+=`<div class="card"><h2>Ausgaben nach Kategorie</h2><div class="bar" role="img" aria-label="Ausgaben nach Kategorie">${cats.map(([c,v])=>`<div style="width:${v/out*100}%;background:${CATS[c][1]}"></div>`).join('')}</div><div class="leg">${cats.map(([c,v])=>`<span><i style="background:${CATS[c][1]}"></i>${c} ${EUR(v)}</span>`).join('')}</div></div>`;
 h+=`<button class="add" id="ab">${ui.form?'Schließen':'＋ Neue Buchung'}</button>`;
 if(ui.form){const o=ui.type==='out';
  h+=`<div class="card"><div class="seg"><button data-t="out" aria-pressed="${o}">Ausgabe</button><button data-t="in" aria-pressed="${!o}">Einnahme</button></div>
  <label for="am">Betrag in Euro</label><input id="am" inputmode="decimal" placeholder="0,00" autocomplete="off">
  <label for="ct">Kategorie</label><select id="ct">${Object.keys(CATS).filter(c=>o?c!=='Einkommen':c==='Einkommen'||c==='Sonstiges').map(c=>`<option>${c}</option>`).join('')}</select>
  <label for="nt">Notiz</label><input id="nt" placeholder="${o?'z. B. Mittagessen':'z. B. Gehalt'}" autocomplete="off">
  <label for="dt">Datum (auch in der Zukunft möglich)</label><input id="dt" type="date" value="${ui.fd||today()}">
  <label class="auto" for="au"><input type="checkbox" id="au"><span>Automatisch wiederholen</span></label>
  <div id="fq" class="hide"><label for="fr">Wie oft?</label><select id="fr"><option value="monthly">Jeden Monat</option><option value="weekly">Jede Woche</option></select></div>
  <button class="primary" id="sv">Buchung speichern</button></div>`}
 h+=`<div class="tabs" role="tablist"><button role="tab" data-tab="cal" aria-selected="${ui.tab==='cal'}">Kalender</button><button role="tab" data-tab="tx" aria-selected="${ui.tab==='tx'}">Buchungen</button><button role="tab" data-tab="ru" aria-selected="${ui.tab==='ru'}">Automatisch (${S.rules.length})</button></div>`;
 if(ui.tab==='cal'){h+=calHTML()}else if(ui.tab==='tx'){const l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
  h+=`<div class="card">${l.length?l.map(t=>`<div class="item"><div class="dot">${CATS[t.cat][0]}</div><div class="t"><b>${esc(t.note||t.cat)}</b><span>${fdate(t.date)} · ${t.cat}${t.auto?' · automatisch':''}${t.date>today()?' · geplant':''}</span></div><div class="amt ${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'−'}${EUR(t.amt)}</div><button class="x" data-del="${t.id}" aria-label="Buchung löschen">×</button></div>`).join(''):'<div class="empty">Noch keine Buchungen. Tippe oben auf „Neue Buchung“.</div>'}</div>`}
 else{h+=`<div class="card">${S.rules.length?S.rules.map(r=>`<div class="item"><div class="dot">${CATS[r.cat][0]}</div><div class="t"><b>${esc(r.note||r.cat)}</b><span>${r.freq==='weekly'?'Jede Woche':'Jeden Monat'} · nächste: ${fdate(r.next)}</span></div><div class="amt ${r.type==='in'?'pos':'neg'}">${r.type==='in'?'+':'−'}${EUR(r.amt)}</div>
  <label class="sw"><input type="checkbox" data-tg="${r.id}" ${r.active?'checked':''} aria-label="Automatik an/aus"><span></span></label><button class="x" data-rd="${r.id}" aria-label="Automatik löschen">×</button></div>`).join(''):'<div class="empty">Noch nichts automatisiert. Setze beim Buchen den Haken „Automatisch wiederholen“.</div>'}</div>`}
 h+=`<div class="foot"><button id="rs">${ui.confirm?'Wirklich alles löschen? Nochmal tippen':'Alle Daten zurücksetzen'}</button></div>`;
 if(ui.toast)h+=`<div class="toast" role="status">${esc(ui.toast)}</div>`;
 el.innerHTML=h;bind()}

function calHTML(){
 const [y,m]=ui.calM.split('-').map(Number),first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate(),t=today();
 const to=iso(new Date(y,m-1,dim)),all=evs(to),E=all.filter(e=>e.date.slice(0,7)===ui.calM),off=(first.getDay()+6)%7;
 const title=first.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
 let g=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="wd">${d}</div>`).join('')+'<div></div>'.repeat(off);
 for(let d=1;d<=dim;d++){const ds=ui.calM+'-'+String(d).padStart(2,'0'),de=E.filter(e=>e.date===ds),o=de.filter(e=>e.type==='out').reduce((a,e)=>a+e.amt,0);
  g+=`<button class="day${ds>t?' fut':''}${ds===t?' today':''}${ds===ui.sel?' sel':''}" data-day="${ds}" aria-label="${d}. ${title}, ${de.length} Buchungen"><span>${d}</span><span class="dots">${de.slice(0,3).map(e=>`<i class="${e.type}"></i>`).join('')}</span><small>${o?'−'+Math.round(o):''}</small></button>`}
 let h=`<div class="card"><div class="mh"><button class="nav" data-mv="-1" aria-label="Vorheriger Monat">‹</button><h2>${title}</h2><button class="nav" data-mv="1" aria-label="Nächster Monat">›</button></div><div class="cal">${g}</div>`;
 if(to>t){const f=bal()+all.filter(e=>e.k!=='done').reduce((a,e)=>a+sgn(e),0);h+=`<div class="fc"><span>Voraussichtlich Ende ${first.toLocaleDateString('de-DE',{month:'long'})}</span><b>${EUR(f)}</b></div>`}
 if(ui.sel>t){const f=bal()+evs(ui.sel).filter(e=>e.k!=='done').reduce((a,e)=>a+sgn(e),0);h+=`<div class="fc"><span>Voraussichtlich am ${fdate(ui.sel)}</span><b>${EUR(f)}</b></div>`}
 const se=evs(ui.sel).filter(e=>e.date===ui.sel);
 h+=`<div class="dh">${parse(ui.sel).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</div>`;
 h+=se.length?se.map(e=>`<div class="item"><div class="dot">${CATS[e.cat][0]}</div><div class="t"><b>${esc(e.note||e.cat)}</b><span>${e.cat}${e.k==='auto'?' · automatisch':e.k==='plan'?' · geplant':''}</span></div><div class="amt ${e.type==='in'?'pos':'neg'}">${e.type==='in'?'+':'−'}${EUR(e.amt)}</div>${e.k!=='auto'?`<button class="x" data-del="${e.id}" aria-label="Buchung löschen">×</button>`:''}</div>`).join(''):'<div class="empty">Nichts an diesem Tag.</div>';
 h+=`<button class="primary" id="pl">${ui.sel>t?'Für diesen Tag planen':'Für diesen Tag buchen'}</button></div>`;
 return h}
function num(s){return parseFloat(String(s).trim().replace(/\./g,'').replace(',','.'))}
const $=id=>document.getElementById(id);
function bind(){
 $('eb').onclick=()=>{ui.editBal=!ui.editBal;render()};
 document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const [y,m]=ui.calM.split('-').map(Number);ui.calM=iso(new Date(y,m-1+Number(b.dataset.mv),1)).slice(0,7);render()});
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ui.sel=b.dataset.day;render()});
 if($('pl'))$('pl').onclick=()=>{ui.form=true;ui.fd=ui.sel;render();window.scrollTo({top:0,behavior:'smooth'})};
 if($('sb'))$('sb').onclick=()=>{const v=num($('nb').value);if(isNaN(v))return toast('Bitte gib eine Zahl ein');S.start+=v-bal();save();ui.editBal=false;toast('Kontostand aktualisiert')};
 $('ab').onclick=()=>{ui.form=!ui.form;render()};
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ui.type=b.dataset.t;render()});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render()});
 if($('au'))$('au').onchange=e=>$('fq').classList.toggle('hide',!e.target.checked);
 if($('sv'))$('sv').onclick=()=>{
  const amt=num($('am').value);if(!(amt>0))return toast('Bitte gib einen Betrag über 0 ein');
  const d=$('dt').value||today(),cat=$('ct').value,note=$('nt').value.trim();
  if($('au').checked){const r={id:uid(),type:ui.type,amt,cat,note,freq:$('fr').value,day:parse(d).getDate(),next:d,active:true};S.rules.push(r);runRules();
   if(parse(r.next)>new Date())toast('Automatik gespeichert – nächste Buchung am '+fdate(r.next));else toast('Automatik gespeichert');
  }else{S.tx.push({id:uid(),type:ui.type,amt,cat,note,date:d});ui.sel=d;ui.calM=d.slice(0,7);toast(d>today()?'Geplant für den '+fdate(d):'Buchung gespeichert')}
  save();ui.form=false;ui.fd='';render()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tx=S.tx.filter(t=>t.id!==b.dataset.del);save();render()});
 document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{S.rules=S.rules.filter(r=>r.id!==b.dataset.rd);save();render()});
 document.querySelectorAll('[data-tg]').forEach(b=>b.onchange=()=>{const r=S.rules.find(r=>r.id===b.dataset.tg);r.active=b.checked;if(r.active){runRules()}save();render()});
 $('rs').onclick=()=>{if(!ui.confirm){ui.confirm=true;render();return}S={start:null,tx:[],rules:[]};ui={tab:'cal',form:false,type:'out',editBal:false,confirm:false,toast:''};save();render()};
}
runRules();render();
</script>
</body>
</html>
